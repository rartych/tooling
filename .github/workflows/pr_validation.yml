# =========================================================================================
# CAMARA Project - Pull Request Validation Workflow
#
# This GitHub Actions is a reusable workflow for validating PRs using tools configuration
# from subfolder indicated by input `configurations` variable.
#
# Validation includes:
# - release-plan.yaml validation (if changed, must be exclusive - no other changes)
# - MegaLinter for API definitions and test files
#
# CHANGELOG:
# - 2025-08-01: Initial version for v0
# - 2026-01-13: Added release-plan.yaml validation with exclusivity check
#
# USAGE:
# The action is invoked by Pull Request Validation Workflow Caller in CAMARA API repositories
#
# DOCUMENTATION:
# see https://github.com/camaraproject/tooling/tree/main/linting/docs
# =========================================================================================

name: PR validation for CAMARA Project

on:
  workflow_call:
    inputs:
      configurations:
        description: Subfolder containing tool configs to be used
        type: string
        required: false
        default: ""

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        uses: tj-actions/changed-files@8cba46e29c11878d930bca7870bb54394d3e8b21 # v47.0.2
        with:
          files_yaml: |
            release_plan:
              - release-plan.yaml
            other:
              - '**'
              - '!release-plan.yaml'

      # ==================== release-plan.yaml Validation ====================
      # If release-plan.yaml changed, it must be the ONLY change in the PR
      # This ensures validation errors from rule changes don't mix with code changes

      - name: Check exclusivity
        id: exclusivity
        if: steps.changes.outputs.release_plan_any_changed == 'true'
        run: |
          if [[ "${{ steps.changes.outputs.other_any_changed }}" == "true" ]]; then
            echo "::error::release-plan.yaml must be changed in a separate PR"
            echo "## Exclusivity Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "release-plan.yaml changes must be in a **separate PR** from other changes." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** If release-plan.yaml changes validation rules (e.g., alpha to rc)," >> $GITHUB_STEP_SUMMARY
            echo "any new errors should be clearly attributable to the rule change, not mixed with code changes." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Please:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Remove release-plan.yaml changes from this PR" >> $GITHUB_STEP_SUMMARY
            echo "2. Create a separate PR for release-plan.yaml updates" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Validate release-plan.yaml
        if: steps.changes.outputs.release_plan_any_changed == 'true'
        id: validate
        uses: camaraproject/tooling/shared-actions/validate-release-plan@v0
        with:
          release_plan_path: release-plan.yaml
          check_files: 'true'

      - name: Report validation status
        if: always() && steps.changes.outputs.release_plan_any_changed == 'true' && steps.exclusivity.outcome != 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const valid = '${{ steps.validate.outputs.valid }}' === 'true';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            // Parse warnings first (needed for status description)
            const warningsStr = `${{ steps.validate.outputs.warnings }}`;
            let warnings = [];
            try {
              warnings = JSON.parse(warningsStr || '[]');
            } catch (e) {
              if (warningsStr && warningsStr.trim()) {
                warnings = [warningsStr];
              }
            }

            // Determine status description
            let description;
            if (!valid) {
              description = 'Validation failed';
            } else if (warnings.length > 0) {
              description = 'Validation passed with warnings';
            } else {
              description = 'Validation passed';
            }

            // Create separate check status (visible in PR checks list)
            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: valid ? 'success' : 'failure',
                context: '--> Validate: release-plan.yaml',
                description: description,
                target_url: runUrl
              });
            } catch (error) {
              if (error.status === 403) {
                core.warning('Cannot post commit status — insufficient permissions (common for fork PRs). Validation result: ' + description);
              } else {
                throw error;
              }
            }

            if (!valid) {
              // Output errors as annotations
              const errorsStr = `${{ steps.validate.outputs.errors }}`;
              let errors = [];
              try {
                errors = JSON.parse(errorsStr || '[]');
              } catch (e) {
                errors = [errorsStr];
              }

              for (const err of errors) {
                core.error(err, {file: 'release-plan.yaml'});
              }

              // Job summary
              core.summary.addHeading('Release Plan Validation Failed', 2);
              core.summary.addList(errors);
              await core.summary.write();

              core.setFailed('Release plan validation failed');
            } else {
              if (warnings.length > 0) {
                for (const warn of warnings) {
                  core.warning(warn, {file: 'release-plan.yaml'});
                }
                core.summary.addHeading('Release Plan Validation Passed with Warnings', 2);
                core.summary.addList(warnings);
              } else {
                core.notice('Validation passed', {file: 'release-plan.yaml'});
                core.summary.addHeading('Release Plan Validation Passed', 2);
              }
              await core.summary.write();
            }

      - name: Skip validation (no release-plan changes)
        if: steps.changes.outputs.release_plan_any_changed != 'true'
        run: echo "::notice::release-plan.yaml not modified, skipping validation"

      # ──  Install tooling ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Install oasdiff CLI
        working-directory: ${{ github.workspace }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh \
            | sh -s -- -b /usr/local/bin
 
      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Extract API list from redocly.yaml
        id: api-list
        run: |
          API_JSON=$(yq e '
            .apis | to_entries |
            map({
              "name":   .key,
              "root":   .value.root,
              "output": .value.output
            })' \
            --output-format=json src/redocly.yaml)
 
          echo "$API_JSON" > /tmp/apis.json
          echo "Parsed $(echo "$API_JSON" | jq length) API(s):"
          echo "$API_JSON" | jq -r '.[] | "  • \(.name)  root=\(.root)  output=\(.output)"'

      # ── Bundle all APIs defined in redocly.yaml ───────────────────────
      - name: Bundle API specs
        id: build
        working-directory: code/API_definitions
        run: |
          set +e
          OUTPUT=$(redocly bundle --config redocly.yaml 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          {
            echo "build_output<<BUILD_OUTPUT_EOF"
            echo "$OUTPUT"
            echo "BUILD_OUTPUT_EOF"
          } >> "$GITHUB_OUTPUT"

          exit $EXIT_CODE

      # ── 5. Upload each bundle as a separate artifact, collect direct URLs ────
      # Uses @actions/artifact v2 (same package upload-artifact@v4 uses) so we
      # get an artifact id back and can build a direct download URL per bundle.
      - name: Upload bundle artifacts
        id: upload
        working-directory: ${{ github.workspace }}
        run: |
          npm install --prefix /tmp/artifact-uploader @actions/artifact 2>/dev/null
 
          node << 'EOF'
          const { DefaultArtifactClient } = require('/tmp/artifact-uploader/node_modules/@actions/artifact');
          const fs   = require('fs');
          const path = require('path');
 
          async function main() {
            const client = new DefaultArtifactClient();
            const apis   = JSON.parse(fs.readFileSync('/tmp/apis.json', 'utf8'));
            const repo   = process.env.GITHUB_REPOSITORY;
            const runId  = process.env.GITHUB_RUN_ID;
            const root   = path.join(process.env.GITHUB_WORKSPACE, 'code/API_definitions');
            const links  = [];
 
            for (const api of apis) {
              const artifactName = `bundle-${api.name.replace(/[@/: ]/g, '-')}`;
              const absOut       = path.join(root, api.output);
              const uploadDir    = path.dirname(absOut);
              const fileName     = path.basename(absOut);
 
              console.log(`Uploading ${artifactName} ...`);
              const { id } = await client.uploadArtifact(
                artifactName,
                [absOut],
                uploadDir
              );
 
              const url = `https://github.com/${repo}/actions/runs/${runId}/artifacts/${id}`;
              links.push(`- [\`${fileName}\`](${url}) — \`${api.name}\``);
              console.log(`  → ${url}`);
            }
 
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `links<<LINKS_EOF\n${links.join('\n')}\nLINKS_EOF\n`
            );
          }
 
          main().catch(err => { console.error(err); process.exit(1); });
          EOF
 
      # ── For each API: fetch base bundle from main, run oasdiff ────────────
      - name: Diff all APIs against main
        id: diff
        run: |
          HAS_BREAKING=false
          COMMENT_BODY=""
 
          jq -c '.[]' /tmp/apis.json | while IFS= read -r api; do
            NAME=$(echo "$api" | jq -r '.name')
            OUT=$(echo "$api"  | jq -r '.output')
            ROOT=$(echo "$api" | jq -r '.root')
            BASE_BUNDLE="/tmp/base_$(basename "$OUT")"
 
            echo "::group::Diffing $NAME"
 
            # Resolve base: committed bundle on main > bundle main source > skip
            if git show origin/main:"code/API_definitions/$OUT" \
                > "$BASE_BUNDLE" 2>/dev/null; then
              BASE_SOURCE="bundle from \`main\`"
            elif git show origin/main:"code/API_definitions/$ROOT" \
                > /tmp/base_source.yaml 2>/dev/null; then
              redocly bundle /tmp/base_source.yaml \
                --output "$BASE_BUNDLE" --ext yaml --force
              BASE_SOURCE="built from source on \`main\`"
            else
              echo "  $NAME not found on main — skipping diff (new API)"
              COMMENT_BODY="${COMMENT_BODY}
          ### \`${NAME}\` — 🆕 New API (no base to diff against)
 
          ---
          "
              echo "::endgroup::"
              continue
            fi
 
            # Full changelog
            CHANGELOG=$(oasdiff changelog --format markdown "$BASE_BUNDLE" "$OUT" 2>&1) || true
            [ -z "$CHANGELOG" ] && CHANGELOG="_No changes._"
 
            # Breaking changes
            BREAKING=$(oasdiff breaking --format markdown "$BASE_BUNDLE" "$OUT" 2>&1)
            BREAK_EXIT=$?
 
            if [ "$BREAK_EXIT" -ne 0 ] && [ -n "$BREAKING" ]; then
              BADGE="🔴 Breaking changes"
              HAS_BREAKING=true
            else
              BADGE="🟢 No breaking changes"
              BREAKING="_None._"
            fi
 
            COMMENT_BODY="${COMMENT_BODY}
          ### \`${NAME}\` — ${BADGE}
          > Base: ${BASE_SOURCE}
 
          <details>
          <summary>📋 Full changelog</summary>
 
          ${CHANGELOG}
 
          </details>
 
          <details>
          <summary>💥 Breaking changes only</summary>
 
          ${BREAKING}
 
          </details>
 
          ---
          "
            echo "::endgroup::"
          done
 
          {
            echo "has_breaking=$HAS_BREAKING"
            echo "comment_body<<ENDOFBODY"
            echo "$COMMENT_BODY"
            echo "ENDOFBODY"
          } >> "$GITHUB_OUTPUT"

      # ── Post / update collapsible PR comment ────────────────────────────────
      - name: Find existing bot comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- oasdiff-report -->'
 
      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- oasdiff-report -->
            ## API Spec — Bundle & Diff
 
            Commit: `${{ github.event.pull_request.head.sha }}`
            Branch: `${{ github.head_ref }}` → `main`
 
            ### 📦 Bundle downloads
            > Artifacts are retained for 30 days. Downloading requires a GitHub login.
 
            ${{ steps.upload.outputs.links }}
 
            <details>
            <summary>🔧 Redocly bundle output</summary>
 
            ```
            ${{ steps.build.outputs.build_output }}
            ```
 
            </details>
 
            ---
 
            ${{ steps.diff.outputs.comment_body }}
 
 

      # ==================== MegaLinter ====================
      # Runs when:
      # - release-plan.yaml was NOT changed, OR
      # - release-plan.yaml was changed AND validation passed
      # Skipped when release-plan.yaml validation fails (no point linting with invalid rules)

      - name: Checkout linting config
        if: steps.changes.outputs.release_plan_any_changed != 'true' || steps.validate.outputs.valid == 'true'
        uses: actions/checkout@v6
        with:
          repository: camaraproject/tooling
          path: lint-config
          # using configurations from v0 floating tag
          ref: v0
          sparse-checkout: |
            linting/config/
          sparse-checkout-cone-mode: false

      - name: Copy config to workspace
        if: steps.changes.outputs.release_plan_any_changed != 'true' || steps.validate.outputs.valid == 'true'
        # --strip-trailing-slashes removes any trailing slashes from each SOURCE argument (when ${{ inputs.configurations }} is empty)
        run: cp -RT --strip-trailing-slashes ${{ github.workspace }}/lint-config/linting/config/${{ inputs.configurations }} ${{ github.workspace }}

      - name: MegaLinter
        id: ml
        if: steps.changes.outputs.release_plan_any_changed != 'true' || steps.validate.outputs.valid == 'true'
        # You can override MegaLinter flavor used to have faster performances
        # c_cpp MegaLinter Flavor https://megalinter.io/latest/flavors/c_cpp/ includes all needed linters - can be upgraded to v8
        uses: oxsecurity/megalinter/flavors/c_cpp@v7
        # configuration of Megalinter
        env:
          VALIDATE_ALL_CODEBASE: true
          PRINT_ALPACA: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_COMMENT_REPORTER: true
          GITHUB_STATUS_REPORTER: true
          DISABLE: COPYPASTE,SPELL,JAVASCRIPT,MARKDOWN
          # OPENAPI_SPECTRAL is deprecated but still present in Megalinter v7
          DISABLE_LINTERS: OPENAPI_SPECTRAL,YAML_PRETTIER,REPOSITORY_GRYPE,REPOSITORY_SEMGREP,REPOSITORY_DEVSKIM,REPOSITORY_KICS,REPOSITORY_TRIVY,REPOSITORY_TRIVY_SBOM,REPOSITORY_TRUFFLEHOG,REPOSITORY_CHECKOV,REPOSITORY_GITLEAKS,YAML_V8R,JAVA_PMD
          API_SPECTRAL_CONFIG_FILE: .spectral.yaml
          YAML_YAMLLINT_CONFIG_FILE: .yamllint.yaml
          GHERKIN_GHERKIN_LINT_CONFIG_FILE: .gherkin-lintrc
          API_SPECTRAL_FILTER_REGEX_INCLUDE: (code/API_definitions/)
          YAML_YAMLLINT_FILTER_REGEX_INCLUDE: (code/API_definitions/)
          GHERKIN_GHERKIN_LINT_FILTER_REGEX_INCLUDE: (code/Test_definitions/)

      - name: Archive reports
        if: (success() || failure()) && steps.ml.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
