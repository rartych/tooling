# =========================================================================================
# CAMARA Project - Pull Request Validation Workflow
#
# This GitHub Actions is a reusable workflow for validating PRs using tools configuration
# from subfolder indicated by input `configurations` variable.
#
# Validation includes:
# - release-plan.yaml validation (if changed, must be exclusive - no other changes)
# - MegaLinter for API definitions and test files
#
# CHANGELOG:
# - 2025-08-01: Initial version for v0
# - 2026-01-13: Added release-plan.yaml validation with exclusivity check
#
# USAGE:
# The action is invoked by Pull Request Validation Workflow Caller in CAMARA API repositories
#
# DOCUMENTATION:
# see https://github.com/camaraproject/tooling/tree/main/linting/docs
# =========================================================================================

name: PR validation for CAMARA Project

on:
  workflow_call:
    inputs:
      configurations:
        description: Subfolder containing tool configs to be used
        type: string
        required: false
        default: ""
permissions:
  pull-requests: write   # post / update PR comment
 
jobs:
 
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Parse redocly.yaml, bundle all APIs, diff against main
  # ════════════════════════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
 
    defaults:
      run:
        working-directory: code/API_definitions
 
    outputs:
      matrix:       ${{ steps.api-list.outputs.matrix_json }}
      build_output: ${{ steps.build.outputs.build_output }}
      comment_body: ${{ steps.diff.outputs.comment_body }}
      has_breaking: ${{ steps.diff.outputs.has_breaking }}
 
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
 
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

 
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest
 
      - name: Install oasdiff CLI
        working-directory: ${{ github.workspace }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh \
            | sh -s -- -b /usr/local/bin
 
      - name: Install yq
        uses: mikefarah/yq@v4
 
      # ── 3. Parse API list — output both /tmp/apis.json and matrix JSON ───────
      - name: Extract API list from redocly.yaml
        id: api-list
        working-directory: ${{ github.workspace }}
        run: |
          REDOCLY_YAML="code/API_definitions/redocly.yaml"
 
          API_JSON=$(yq e '
            .apis | to_entries |
            map({
              "name":   .key,
              "root":   .value.root,
              "output": .value.output
            })' \
            --output-format=json "$REDOCLY_YAML")
 
          echo "$API_JSON" > /tmp/apis.json
          echo "Parsed $(echo "$API_JSON" | jq length) API(s):"
          echo "$API_JSON" | jq -r '.[] | "  • \(.name)  root=\(.root)  output=\(.output)"'
 
          # Wrap in {"include":[...]} for use as a strategy matrix
          MATRIX_JSON=$(echo "$API_JSON" | jq -c '{"include": .}')
          echo "matrix_json=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
 
      # ── 4. Bundle all APIs ────────────────────────────────────────────────────
      - name: Bundle API specs
        id: build
        run: |
          set +e
          OUTPUT=$(redocly bundle --config redocly.yaml 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "build_output<<BUILD_OUTPUT_EOF"
            echo "$OUTPUT"
            echo "BUILD_OUTPUT_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
 
      # ── 5. Diff all APIs against main ─────────────────────────────────────────
      - name: Diff all APIs against main
        id: diff
        run: |
          HAS_BREAKING=false
          COMMENT_BODY=""
 
          while IFS= read -r api; do
            NAME=$(echo "$api" | jq -r '.name')
            OUT=$(echo "$api"  | jq -r '.output')
            ROOT=$(echo "$api" | jq -r '.root')
            BASE_BUNDLE="/tmp/base_$(basename "$OUT")"
 
            echo "::group::Diffing $NAME"
 
            if git show origin/main:"code/API_definitions/$OUT" \
                > "$BASE_BUNDLE" 2>/dev/null; then
              BASE_SOURCE="bundle from \`main\`"
            elif git show origin/main:"code/API_definitions/$ROOT" \
                > /tmp/base_source.yaml 2>/dev/null; then
              redocly bundle /tmp/base_source.yaml \
                --output "$BASE_BUNDLE" --ext yaml --force
              BASE_SOURCE="built from source on \`main\`"
            else
              echo "  $NAME not found on main — new API, skipping diff"
              COMMENT_BODY="${COMMENT_BODY}
          ### \`${NAME}\` — 🆕 New API (no base to diff against)
 
          ---
          "
              echo "::endgroup::"
              continue
            fi
 
            CHANGELOG=$(oasdiff changelog --format markdown "$BASE_BUNDLE" "$OUT" 2>&1) || true
            [ -z "$CHANGELOG" ] && CHANGELOG="_No changes._"
 
            BREAKING=$(oasdiff breaking --format markdown "$BASE_BUNDLE" "$OUT" 2>&1)
            BREAK_EXIT=$?
 
            if [ "$BREAK_EXIT" -ne 0 ] && [ -n "$BREAKING" ]; then
              BADGE="🔴 Breaking changes"
              HAS_BREAKING=true
            else
              BADGE="🟢 No breaking changes"
              BREAKING="_None._"
            fi
 
            COMMENT_BODY="${COMMENT_BODY}
          ### \`${NAME}\` — ${BADGE}
          > Base: ${BASE_SOURCE}
 
          <details>
          <summary>📋 Full changelog</summary>
 
          ${CHANGELOG}
 
          </details>
 
          <details>
          <summary>💥 Breaking changes only</summary>
 
          ${BREAKING}
 
          </details>
 
          ---
          "
            echo "::endgroup::"
          done < <(jq -c '.[]' /tmp/apis.json)
 
          {
            echo "has_breaking=$HAS_BREAKING"
            echo "comment_body<<ENDOFBODY"
            echo "$COMMENT_BODY"
            echo "ENDOFBODY"
          } >> "$GITHUB_OUTPUT"
 
      # ── 6. Upload all bundles as one internal artifact for the matrix job ────
      - name: Stage bundles for hand-off
        run: |
          STAGE=/tmp/all-bundles
          mkdir -p "$STAGE"
          while IFS= read -r out; do
            cp "$out" "$STAGE/$(basename "$out")"
          done < <(jq -r '.[] | .output' /tmp/apis.json)
 
      - name: Upload internal bundle archive
        uses: actions/upload-artifact@v7
        with:
          name: all-bundles-${{ github.event.pull_request.head.sha }}
          path: /tmp/all-bundles/
          retention-days: 1   # hand-off only; individual artifacts replace this
 
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Re-upload each bundle as its own named artifact (matrix)
  # ════════════════════════════════════════════════════════════════════════════
  upload-bundles:
    needs: prepare
    runs-on: ubuntu-latest
 
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
 
    steps:
      - name: Download internal bundle archive
        uses: actions/download-artifact@v8
        with:
          name: all-bundles-${{ github.event.pull_request.head.sha }}
          path: /tmp/all-bundles
 
      # Derive sanitised artifact name and bare filename in a shell step —
      # expressions in `with:` blocks cannot call functions like basename.
      # Artifact name: bundle-<n> with @ / : space replaced by -
      - name: Resolve artifact metadata
        id: meta
        run: |
          ARTIFACT_NAME="bundle-$(echo '${{ matrix.name }}' | tr '@/: ' '-')"
          FILE=$(basename '${{ matrix.output }}')
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "file=$FILE"                   >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" 
          echo "file=$FILE"
 
      - name: Upload bundle — ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: /tmp/all-bundles/${{ steps.meta.outputs.file }}
          archive: false
 
    # Per-matrix outputs are not directly aggregatable in GitHub Actions;
    # the pr-comment job queries the REST API for artifact IDs instead.
 
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Post PR comment with per-artifact download links
  # ════════════════════════════════════════════════════════════════════════════
  pr-comment:
    needs: [prepare, upload-bundles]
    runs-on: ubuntu-latest
 
    steps:
      # Query the Actions REST API to resolve artifact name → id → direct URL
      - name: Resolve artifact links
        id: artifact-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_JSON:  ${{ needs.prepare.outputs.matrix }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
 
          # Fetch artifact list for this run
          ARTIFACTS=$(curl -sSf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
 
          LINKS=""
          while IFS= read -r api; do
            NAME=$(echo "$api" | jq -r '.name')
            FILE=$(echo "$api" | jq -r '.output' | xargs basename)
 
            # Must match the sanitised name produced by the upload-bundles job
            ARTIFACT_NAME="bundle-$(echo "${NAME}" | tr '@/: ' '-')"
            ID=$(echo "$ARTIFACTS" | jq -r \
              --arg n "$ARTIFACT_NAME" \
              '.artifacts[] | select(.name == $n) | .id')
 
            if [ -n "$ID" ]; then
              LINKS="${LINKS}- [\`${FILE}\`](${RUN_URL}/artifacts/${ID}) — \`${NAME}\`\n"
            else
              LINKS="${LINKS}- \`${FILE}\` — \`${NAME}\` _(artifact not found)_\n"
            fi
          done < <(echo "$MATRIX_JSON" | jq -c '.include[]')
 
          {
            echo "links<<LINKS_EOF"
            printf "%b" "$LINKS"
            echo "LINKS_EOF"
          } >> "$GITHUB_OUTPUT"
 
      - name: Find existing bot comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- oasdiff-report -->'
 
      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- oasdiff-report -->
            ## API Spec — Bundle & Diff
 
            Commit: `${{ github.event.pull_request.head.sha }}`
            Branch: `${{ github.head_ref }}` → `main`
 
            ### 📦 Bundle downloads
            > Artifacts are retained for 30 days. Downloading requires a GitHub login.
 
            ${{ steps.artifact-links.outputs.links }}
 
            <details>
            <summary>🔧 Redocly bundle output</summary>
 
            ```
            ${{ needs.prepare.outputs.build_output }}
            ```
 
            </details>
 
            ---
 
            ${{ needs.prepare.outputs.comment_body }}
 
      - name: Fail on breaking changes
        if: needs.prepare.outputs.has_breaking == 'true'
        run: |
          echo "::error::Breaking API changes detected in one or more specs. Review the PR comment."
          exit 1
